databaseChangeLog:
  - changeSet:
      id: 001-init
      author: pelanode
      comment: Schema from P0-13 section 7
      changes:
        - sqlFile:
            path: sql/001-init.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 002-review-mission-time
      author: pelanode
      comment: Mission time of each review (shown by the UI next to the real time)
      changes:
        - sqlFile:
            path: sql/002-review-mission-time.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
