# All settings come from PN_* environment variables (P0-11 section 7).
# Defaults work for a local run (IDE or mvnw) without any setting: relative data paths are
# looked up from the working directory upwards (DataPaths), so the repository root or any sub-folder works.

spring:
  application:
    name: pelanode-poc
  # Local settings without exporting variables: PN_* keys in config/.env (git-ignored) are read here.
  config:
    import: optional:file:./config/.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # Database: embedded H2 by default (no setup). PostgreSQL by setting PN_DB_URL to a
  # jdbc:postgresql:// URL plus PN_DB_USER / PN_DB_PASSWORD. H2 URLs get the PostgreSQL
  # compatibility options appended automatically (DatabaseConfig).
  datasource:
    url: ${PN_DB_URL:jdbc:h2:file:./.data/pelanode}
    username: ${PN_DB_USER:sa}
    password: ${PN_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  web:
    resources:
      add-mappings: true

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always

logging:
  level:
    root: ${PN_LOG_LEVEL:INFO}

pelanode:
  demo-pack-dir: ${PN_DEMO_PACK_DIR:data/demo/hack-001}
  media-root: ${PN_MEDIA_ROOT:data/demo/hack-001/media}
  export-dir: ${PN_EXPORT_DIR:./.data/exports}
  demo-mission-id: ${PN_DEMO_MISSION_ID:HACK-001}
  seed-on-startup: ${PN_SEED_ON_STARTUP:true}
  simulated-mode: ${PN_SIMULATED_MODE:true}
  replay-speed: ${PN_REPLAY_SPEED:demo}
  replay-autostart: ${PN_REPLAY_AUTOSTART:false}
  ai-mode: ${PN_AI_MODE:precomputed}
  ai-outputs-file: ${PN_AI_OUTPUTS_FILE:}
  context-adapter: ${PN_CONTEXT_ADAPTER:simulated}
  context-dir: ${PN_CONTEXT_DIR:}
  assoc-level-km: ${PN_ASSOC_LEVEL_KM:25}
  assoc-level-hours: ${PN_ASSOC_LEVEL_HOURS:6}
  assoc-temp-km: ${PN_ASSOC_TEMP_KM:50}
  assoc-temp-hours: ${PN_ASSOC_TEMP_HOURS:24}
  write-api-key: ${PN_WRITE_API_KEY:}
  cors-origins: ${PN_CORS_ORIGINS:http://localhost:5173}

---
spring:
  config:
    activate:
      on-profile: local
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: cloud
# Cloud Run has no persistent disk; only /tmp is writable (P0-17 P17-03).
# A container restart therefore equals a reset.
pelanode:
  export-dir: ${PN_EXPORT_DIR:/tmp/exports}
